name: Docker Image Continuous integration

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'netcore'
    #paths:
    #  - 'src/EPiServer.Search.IndexingService/**'
    #  - 'test/EPiServer.Search.IndexingService.Test/**'
    #  - 'docker-compose.yml'

jobs:
  build_test_pack:
    name: Build, test & push image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME:  ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          # net6.0 (EPiServer.Search.Cms, EPiServer.Search.Cms.Test) and net7.0 (IndexingService) are both built and tested;
          # the hosted runners no longer ship the .NET 6 runtime, so install it explicitly.
          dotnet-version: |
            6.0.x
            7.0.x
      - name: Restore
        run: dotnet restore
      - name: Test
        run: dotnet test --configuration Release
      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/indexingservice
          tags: |
            type=sha
      - name: Push to GitHub Packages
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: src/EPiServer.Search.IndexingService/Search.Dockerfile
